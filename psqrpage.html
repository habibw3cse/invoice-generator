<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PS Sports</title>

<style>

body{
    font-family: 'Segoe UI', sans-serif;
    margin:0;
    padding:40px;

    /* YOUR VISITING CARD BACKGROUND */
    background:url('background.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* MAIN CONTENT CARD */
.card{
    width:700px;
    background:rgba(255,255,255,0.92);
    border-radius:12px;
    padding:30px;
    margin:auto;
    box-shadow:0 6px 20px rgba(0,0,0,0.2);
}

/* HEADER */
.company{
    font-size:48px;
    font-weight:bold;
    color:#2c3e50;
}

.subtitle{
    font-size:20px;
    color:#34495e;
    margin-top:-8px;
}

.tagline{
    font-size:14px;
    color:#6c757d;
    margin-bottom:25px;
}

/* INFO */
.name{
    font-size:22px;
    font-weight:600;
    color:#2c3e50;
}

.designation{
    color:#6c757d;
    margin-bottom:15px;
}

.info{
    margin-top:8px;
    color:#495057;
    font-size:16px;
}

/* SERVICES */
.services{
    margin-top:25px;
}

.services h3{
    color:#2c3e50;
}

.services li{
    list-style:none;
    padding:8px 0;
    font-size:17px;
    color:#2c3e50;
}

.services li::before{
    content:"✔ ";
    font-weight:bold;
}

/* MAP */
iframe{
    width:100%;
    height:300px;
    border:none;
    border-radius:10px;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="card">

    <div class="company">PS Sports</div>
    <div class="subtitle">Sports Accessories</div>
    <div class="tagline">Performance Starts Here.</div>

  
    <div class="info">📞 ####</div>
    <div class="info">📍 ####, Chattogram</div>
    <div class="info">🌐 ####</div>

    <!-- Google Map -->
    <iframe src="https://www.google.com/maps?q=22.3351949,91.794279&output=embed"></iframe>

    <!-- Services -->
    <div class="services">
        <h3>Our Services</h3>
        <ul>
            <li>Sports Accessories</li>
          <!--   <li>Mobile App Development</li>
            <li>Business Automation Software</li>
            <li>ERP & Accounting Solutions</li>
            <li>IT Consultancy</li> -->
        </ul>
    </div>

</div>

</body>
</html>
